name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "secrets.DEPLOY_SSH_KEY is not set"; exit 1; }
          test -n "$DEPLOY_HOST_FINGERPRINT" || { echo "secrets.DEPLOY_HOST_FINGERPRINT is not set, see deploy/README.md"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_HOST_FINGERPRINT" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload sources
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            --exclude '.git' --exclude 'node_modules' --exclude 'target' \
            --exclude 'deploy/.env' \
            --exclude 'deploy/compose.override.yml' --exclude 'deploy/tls-file.caddy' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"

      - name: Rebuild and restart
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIR/deploy' && docker compose up -d --build --remove-orphans"
