spring:
  application:
    name: wiki-pulse-project

  profiles:
    default: yt

  jackson:
    property-naming-strategy: SNAKE_CASE

  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        size: 2

app:
  live:
    window-minutes: 30
    # ВРЕМЕННО: старые события не протухают и не вытесняются.
    # В main должно быть true.
    window-enabled: false
    #zoom <= zoom-r3-max  -> r3
    #zoom-r3-max < zoom <= zoom-r6-max -> r6
    #zoom > zoom-r6-max   -> r9
    zoom-min: 0          #карты начинаются с 0 весь мир
    zoom-max: 30         #потолок
    zoom-r3-max: 5       #маппинг zoom -> resolution
    zoom-r6-max: 11
    hexagon-events-cap: 50        #максимум событий в массиве events в одном гексагоне(больше хранить очень тяжело да и не нужно - правок может быть тысячи)
  poller:
    interval-ms: 500
    # ВРЕМЕННО для проверки старых данных: читаем очередь с первой строки.
    # В main должно быть false, иначе бэкенд при старте вычитывает всю очередь.
    start-from-beginning: true
    max-pages-per-tick: 10

yt:
  proxy: "${YT_PROXY}"
  token: "${YT_TOKEN}"
  timeout:
    ms: 30000

  table:
    q_enriched: //home/wikipulse/q_enriched
    marts:
      trends: //home/wikipulse/marts/trends
      top_articles: //home/wikipulse/marts/top_articles
      top_geo: //home/wikipulse/marts/top_geo
