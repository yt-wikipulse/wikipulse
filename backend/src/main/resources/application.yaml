spring:
  application:
    name: wikipulse

  profiles:
    default: yt

  jackson:
    property-naming-strategy: SNAKE_CASE

  mvc:
    problemdetails:
      enabled: true

  task:
    scheduling:
      pool:
        size: 2

app:
  ymaps:
    api-key: "${YMAPS_API_KEY:}"

  live:
    window-minutes: 30
    zoom-min: 0
    zoom-max: 30
    zoom-r3-max: 6
    zoom-r4-max: 7
    zoom-r5-max: 9
    zoom-r6-max: 11
    zoom-r8-max: 13
    hexagon-events-cap: 50

  poller:
    interval-ms: 500
    max-pages-per-tick: 10

yt:
  proxy: "${YT_PROXY}"
  token: "${YT_TOKEN}"
  base-path: "${YT_BASE_PATH://home/wikipulse}"

  consumer:
    q_enriched: "${yt.base-path}/consumers/c_backend"

  table:
    q_enriched: "${yt.base-path}/q_enriched"
    marts:
      trends: "${yt.base-path}/marts/trends"
      top_articles: "${yt.base-path}/marts/top_articles"
      top_geo: "${yt.base-path}/marts/top_geo"
