spring:
  application:
    name: wiki-pulse-project

  profiles:
    default: mock

  jackson:
    property-naming-strategy: SNAKE_CASE

  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        size: 2

app:
  live:
    window-minutes: 30
    # zoom <= zoom-r3-max        -> r3
    # zoom-r3-max < zoom <= zoom-r6-max -> r6
    # zoom > zoom-r6-max         -> r9
    zoom-r3-max: 5
    zoom-r6-max: 11
    hexagon-events-cap: 50        #максимум событий в массиве events в одном гексагоне(больше хранить очень тяжело да и не нужно - правок может быть тысячи)
  poller:
    interval-ms: 500
    max-pages-per-tick: 10

yt:
  proxy: "${YT_PROXY}"
  token: "${YT_TOKEN}"
  timeout:
    ms: 30000

  table:
    q_enriched: //home/wikipulse/q_enriched
