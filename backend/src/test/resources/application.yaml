spring:
  application:
    name: wiki-pulse-project

  profiles:
    default: mock

  jackson:
    property-naming-strategy: SNAKE_CASE

  mvc:
    problemdetails:
      enabled: true

  task:
    scheduling:
      pool:
        size: 2

yt:
  proxy: "${YT_PROXY:localhost}"
  token: "${YT_TOKEN:test-token}"
  base-path: "${YT_BASE_PATH://home/wikipulse}"

  table:
    q_enriched: "${yt.base-path}/q_enriched"
    marts:
      trends: "${yt.base-path}/marts/trends"
      top_articles: "${yt.base-path}/marts/top_articles"
      top_geo: "${yt.base-path}/marts/top_geo"
