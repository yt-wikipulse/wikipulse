name: wikipulse

x-service: &service
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-yt-env: &yt-env
  YT_PROXY: ${YT_PROXY:?}
  YT_TOKEN: ${YT_TOKEN:?}
  YT_BASE_PATH: ${YT_BASE_PATH:-//home/wikipulse}

services:
  backend:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      <<: *yt-env
      YMAPS_API_KEY: ${YMAPS_API_KEY:-}

  ingestor:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/bigdata.Dockerfile
    command: ingestor
    environment:
      <<: *yt-env
      WIKIPULSE_CONTACT: ${WIKIPULSE_CONTACT:-}

  scheduler:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/bigdata.Dockerfile
    command: scheduler
    environment: *yt-env

  web:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    cap_add:
      - NET_BIND_SERVICE
    environment:
      DOMAIN: ${DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data
    depends_on:
      - backend

volumes:
  caddy:
